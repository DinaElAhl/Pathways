:root{
  --indigo-600:#4f46e5;--indigo-700:#4338ca;--indigo-500:#6366f1;
  --violet-600:#7c3aed;--violet-500:#8b5cf6;
  --grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);
  --grad-soft:linear-gradient(135deg,#eef2ff 0%,#f5f3ff 100%);
  --ink-900:#0f172a;--ink-700:#334155;--ink-500:#64748b;--ink-400:#94a3b8;
  --line:#e2e8f0;--bg:#f8fafc;--surface:#fff;--surface-2:#f1f5f9;
  --green-600:#16a34a;--green-50:#f0fdf4;--amber-500:#f59e0b;--amber-50:#fffbeb;
  --red-600:#dc2626;--red-50:#fef2f2;--sky-600:#0284c7;
  --child-layla:#db2777;--child-yusuf:#0891b2;--child-zayd:#ea580c;

  --sh-sm:0 1px 2px rgba(15,23,42,.06);--sh-md:0 4px 12px rgba(15,23,42,.08);--sh-lg:0 12px 32px rgba(15,23,42,.12);
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--sp-8:48px;--maxw:1200px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink-900);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
h3{font-size:18px;font-weight:600}h4{font-size:15px;font-weight:600}
.small{font-size:13px}.tiny{font-size:12px;color:var(--ink-500)}
a{color:var(--indigo-600);text-decoration:none}
:focus-visible{outline:2px solid var(--indigo-600);outline-offset:2px;border-radius:6px}
.display{font-size:clamp(32px,5vw,56px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-md);font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:.15s;font-family:inherit}
.btn-primary{background:var(--indigo-600);color:#fff}.btn-primary:hover{background:var(--indigo-700)}
.btn-grad{background:var(--grad);color:#fff}.btn-grad:hover{filter:brightness(1.05)}
.btn-ghost{background:var(--surface);color:var(--ink-700);border-color:var(--line)}.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{height:32px;padding:0 12px;font-size:13px}.btn-lg{height:48px;padding:0 24px;font-size:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-sm);padding:var(--sp-5)}
.card-hover{transition:.18s}.card-hover:hover{box-shadow:var(--sh-lg);transform:translateY(-2px)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-full);font-size:12px;font-weight:600}
.pill-green{background:var(--green-50);color:var(--green-600)}.pill-amber{background:var(--amber-50);color:var(--amber-500)}
.pill-red{background:var(--red-50);color:var(--red-600)}.pill-indigo{background:#eef2ff;color:var(--indigo-600)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:12px;color:var(--ink-500);font-size:12px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line)}tr:hover td{background:var(--surface-2)}
.progress{height:8px;background:var(--surface-2);border-radius:var(--r-full);overflow:hidden}
.progress>span{display:block;height:100%;background:var(--grad);border-radius:var(--r-full);transition:width .8s ease}
.stat-card .num{font-size:28px;font-weight:700}.stat-card .lbl{font-size:13px;color:var(--ink-500)}
.container{max-width:var(--maxw);margin:0 auto;padding:0 24px}
.grid{display:grid;gap:24px}.g-2{grid-template-columns:repeat(2,1fr)}.g-3{grid-template-columns:repeat(3,1fr)}.g-4{grid-template-columns:repeat(4,1fr)}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:24px 0;border-bottom:1px solid var(--line);margin-bottom:24px;flex-wrap:wrap}
.page-sub{color:var(--ink-500);font-size:14px;margin-top:4px}.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding:8px}
.brand .mark{width:32px;height:32px;border-radius:9px;background:var(--grad);flex:none}
.nav-group-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-500);padding:12px 12px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-md);color:var(--ink-700);font-weight:500;font-size:14px}
.nav-item:hover{background:var(--surface-2)}.nav-item.active{background:#eef2ff;color:var(--indigo-600);font-weight:600}
.nav-item .ico{width:18px;height:18px;flex:none}.nav-spacer{flex:1}
.hh-card{margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:var(--r-md);display:flex;align-items:center;gap:8px;font-size:13px}
.topbar{display:flex;align-items:center;gap:16px;height:64px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar .search{flex:1;max-width:360px;height:38px;border:1px solid var(--line);border-radius:var(--r-full);padding:0 14px;background:var(--surface-2);font-size:14px;font-family:inherit}
.avatar{width:34px;height:34px;border-radius:var(--r-full);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;background:var(--indigo-600);flex:none}
.main{min-width:0}.content{max-width:var(--maxw);margin:0 auto;padding:0 24px 48px}
.hamburger{display:none;background:none;border:none;cursor:pointer;padding:6px;color:var(--ink-700)}
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:40;display:none}.backdrop.show{display:block}
.modal-wrap{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,42,.45)}
.modal-wrap.show{display:flex}
.modal-card{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-lg);max-width:480px;width:100%;padding:24px;max-height:90vh;overflow-y:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink-900);color:#fff;padding:12px 20px;border-radius:var(--r-full);font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.3s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{padding:10px 16px;font-size:14px;font-weight:600;color:var(--ink-500);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-family:inherit}
.tab.active{color:var(--indigo-600);border-bottom-color:var(--indigo-600)}
.tab-panel{display:none}.tab-panel.active{display:block}
.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;height:40px;border:1px solid var(--line);border-radius:var(--r-md);padding:0 12px;font-size:14px;font-family:inherit;background:var(--surface)}
.field textarea{height:auto;padding:10px 12px;min-height:72px}
@media(max-width:768px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:.25s;width:260px}
  .sidebar.open{transform:none}.hamburger{display:inline-flex}
  .g-2,.g-3,.g-4{grid-template-columns:1fr}
  .page-head{align-items:flex-start}
  table.responsive{display:block;overflow-x:auto;white-space:nowrap}
}
@media print{
  .sidebar,.topbar,.hamburger,.no-print{display:none!important}
  .app{display:block}.content{padding:0}body{background:#fff}
}
/* ===== PAGE STYLES ===== */

.hero-stat .num{font-size:20px;font-weight:700}
.hero-stat .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.04em;opacity:.85}
.subj-card{display:flex;flex-direction:column;gap:10px}
.subj-card h4{display:flex;align-items:center;justify-content:space-between;gap:8px}
.subj-dot{width:10px;height:10px;border-radius:50%;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:11px;font-weight:700;color:var(--ink-400);text-align:center;text-transform:uppercase}
.cal-day{aspect-ratio:1;border-radius:var(--r-sm);display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--ink-500)}
.cal-day.present{background:var(--green-50);color:var(--green-600)}
.cal-day.absent{background:var(--red-50);color:var(--red-600)}
.cal-day.holiday{background:var(--amber-50);color:var(--amber-500)}
.cal-day.empty{background:transparent}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--ink-500)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.port-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:768px){.port-grid{grid-template-columns:1fr}}
.port-card{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.port-thumb{height:96px;display:grid;place-items:center;color:#fff}
.port-thumb svg{width:32px;height:32px}
.port-body{padding:12px}
.rail-card h4{margin-bottom:10px}
.note-item{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.note-item:last-child{border-bottom:none}
.mark-badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:var(--r-full);font-size:12px;font-weight:700}

</head>

/* ===== BLOCK C — shared helpers ===== */
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('backdrop').classList.toggle('show');}
function openModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
let _toastT;function showToast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}t.textContent=msg;t.classList.add('show');clearTimeout(_toastT);_toastT=setTimeout(()=>t.classList.remove('show'),2500);}
function initTabs(scope){(scope||document).querySelectorAll('[data-tabs]').forEach(function(group){var tabs=group.querySelectorAll('.tab');tabs.forEach(function(tab){tab.addEventListener('click',function(){var panelId=tab.getAttribute('data-tab');group.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');var host=group.getAttribute('data-panels')?document.getElementById(group.getAttribute('data-panels')):group.parentElement;host.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));var panel=document.getElementById(panelId);if(panel)panel.classList.add('active');});});});}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.modal-wrap.show').forEach(m=>m.classList.remove('show'));}});
document.addEventListener('DOMContentLoaded',function(){initTabs();document.querySelectorAll('.progress>span').forEach(function(el){var w=el.style.width;el.style.width='0';setTimeout(()=>el.style.width=w,100);});});

      ["Great momentum","Yusuf finished the Ratios unit ahead of schedule — very engaged this week."],
      ["Watch area","Arabic vocab quiz dipped to a B; add 10 min of review flashcards daily."],
      ["Encouragement","Keeping his Qur'an reading streak going — celebrate day 7 tomorrow, insha'Allah."]
    ],
    faithExtra:null
  },
  zayd:{
    marks:[["Reading & Phonics","Blends short-vowel words","Meeting"],["Math 2","Adds within 100","Exceeding"],["Math 2","Tells time to 5 min","Approaching"],["Science Explorers","Sorts living/non-living","Meeting"],["Arabic I","Recognizes all letters","Meeting"],["Qur'an","Recites Al-Fatihah","Exceeding"]],
    portfolio:[
      ["My Family Drawing","Faith & Character","Jul 12"],
      ["Counting Bears Worksheet","Math 2","Jul 10"],
      ["Sight-Word Booklet","Reading & Phonics","Jul 9"],
      ["Butterfly Life-Cycle Chart","Science Explorers","Jul 8"],
      ["Arabic Alphabet Tracing","Arabic I","Jul 7"]
    ],
    notes:[
      ["Reading progress","Zayd is blending short-vowel words confidently — ready for simple sentences."],
      ["Play-based","Keep math hands-on with counting bears; he loses focus with worksheets alone."],
      ["Faith","Loves the Stories of the Prophets read-alouds — ask him to retell one each week."]
    ],
    faithExtra:null
  }
};

function subjectAccent(id){return ACCENT[id];}

function renderSwitcher(activeId){
  var host=document.getElementById('childSwitcher');
  host.innerHTML='';
  FAMILY.children.forEach(function(c){
    var b=document.createElement('button');
    b.className='switch-pill'+(c.id===activeId?' active':'');
    if(c.id===activeId){b.style.background=ACCENT[c.id];}
    b.innerHTML='<span class="sp-av" style="background:'+(c.id===activeId?'rgba(255,255,255,.25)':ACCENT[c.id])+'">'+c.initials+'</span>'+c.name.split(' ')[0];
    b.setAttribute('aria-pressed', c.id===activeId?'true':'false');
    b.onclick=function(){renderChild(c.id);};
    host.appendChild(b);
  });
}

function renderHero(c){
  var acc=ACCENT[c.id];
  var courses=c.subjects.length;
  var host=document.getElementById('childHero');
  host.style.background='linear-gradient(135deg,'+acc+' 0%, '+shade(acc)+' 100%)';
  host.innerHTML=
    '<span class="big-av">'+c.initials+'</span>'+
    '<div style="flex:1;min-width:200px">'+
      '<h2>'+c.name+'</h2>'+
      '<div class="meta">'+c.grade+' · Age '+c.age+' · '+FAMILY.school+'</div>'+
      '<div class="hero-stats">'+
        '<div class="hero-stat"><div class="num">'+courses+'</div><div class="lbl">Courses</div></div>'+
        '<div class="hero-stat"><div class="num">'+c.avgLabel+'</div><div class="lbl">Avg grade</div></div>'+
        '<div class="hero-stat"><div class="num">'+c.attendance+'%</div><div class="lbl">Attendance</div></div>'+
        '<div class="hero-stat"><div class="num">'+c.streak+'</div><div class="lbl">Day streak</div></div>'+
      '</div>'+
    '</div>';
}

function shade(hex){
  // darken a hex color ~18% for gradient end
  var h=hex.replace('#','');var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  r=Math.round(r*.72);g=Math.round(g*.72);b=Math.round(b*.72);
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

function renderCourses(c){
  var acc=ACCENT[c.id];
  var seeds=[[42,58,'Continuing this unit'],[31,40,'Building fluency'],[18,24,'Almost there'],[55,60,'Nearly complete'],[12,30,'Just getting started'],[24,36,'Steady progress'],[38,48,'On pace']];
  var nexts=['Next: Applying the concept','Next: Guided practice set','Next: Unit checkpoint','Next: Reading & response','Next: Vocabulary review','Next: Hands-on activity','Next: Recitation practice'];
  var cards=c.subjects.map(function(s,i){
    var done=seeds[i%seeds.length][0], total=seeds[i%seeds.length][1];
    var pct=Math.round(done/total*100);
    return '<div class="card subj-card card-hover">'+
      '<h4><span style="display:inline-flex;align-items:center;gap:8px"><span class="subj-dot" style="background:'+acc+'"></span>'+s+'</span><span class="tiny">'+pct+'%</span></h4>'+
      '<div class="progress"><span style="width:'+pct+'%"></span></div>'+
      '<div class="tiny">'+done+' / '+total+' lessons complete</div>'+
      '<div class="small" style="color:var(--ink-700)">'+nexts[i%nexts.length]+'</div>'+
      '<a class="btn btn-ghost btn-sm" href="learn.html" style="align-self:flex-start">Continue'+
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>'+
    '</div>';
  }).join('');
  document.getElementById('pCourses').innerHTML='<div class="grid g-3">'+cards+'</div>';
}

function renderGrades(c){
  var host=document.getElementById('pGrades');
  if(c.marksStyle==='standards'){
    var marks=EXTRA[c.id].marks;
    var rows=marks.map(function(m){
      var cls=m[2]==='Exceeding'?'pill-green':(m[2]==='Meeting'?'pill-indigo':'pill-amber');
      return '<tr><td style="font-weight:600">'+m[0]+'</td><td>'+m[1]+'</td><td><span class="pill '+cls+'">'+m[2]+'</span></td></tr>';
    }).join('');
    host.innerHTML='<div class="card"><h3 style="margin-bottom:6px">Standards-Based Marks</h3>'+
      '<p class="tiny" style="margin-bottom:14px">'+c.name.split(' ')[0]+' is assessed against grade-level standards rather than letter grades.</p>'+
      '<div style="overflow-x:auto"><table class="responsive"><thead><tr><th>Subject</th><th>Standard</th><th>Mark</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
    return;
  }
  var g = c.id==='yusuf' ? c.recentGrades : EXTRA.layla.grades;
  var rows=g.map(function(r){
    var letter=r[4];
    var cls='pill-indigo';
    if(/^A/.test(letter)||letter==='Excellent')cls='pill-green';
    else if(/^C/.test(letter)||/^D/.test(letter)||/^F/.test(letter))cls='pill-amber';
    return '<tr><td style="font-weight:600">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td><span class="pill '+cls+'">'+letter+'</span></td></tr>';
  }).join('');
  host.innerHTML='<div class="card"><h3 style="margin-bottom:14px">Recent Graded Work</h3>'+
    '<div style="overflow-x:auto"><table class="responsive"><thead><tr><th>Assignment</th><th>Subject</th><th>Date</th><th>Score</th><th>Grade</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

function renderAttendance(c){
  // July 2026: July 1 = Wednesday. Today = Jul 16.
  var acc=ACCENT[c.id];
  var firstDow=3; // Sun=0 ... Wed=3
  var days=31, today=16;
  var absentDays = c.id==='layla'?[10]:(c.id==='yusuf'?[8]:[7,15]);
  var holidayDays=[3]; // observed holiday
  var cells='';
  var dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  dows.forEach(d=>cells+='<div class="dow">'+d+'</div>');
  for(var i=0;i<firstDow;i++)cells+='<div class="cal-day empty"></div>';
  for(var d=1;d<=days;d++){
    var dow=(firstDow+d-1)%7;
    var weekend=(dow===0||dow===6);
    var cls='cal-day';
    if(holidayDays.indexOf(d)>=0)cls+=' holiday';
    else if(weekend){cls+=' empty';}
    else if(d<=today){cls+= absentDays.indexOf(d)>=0?' absent':' present';}
    cells+='<div class="'+cls+'">'+d+'</div>';
  }
  var hoursPct=Math.round(c.hours/c.hoursReq*100);
  document.getElementById('pAttendance').innerHTML=
    '<div class="grid g-2" style="grid-template-columns:1.4fr 1fr">'+
      '<div class="card"><h3 style="margin-bottom:4px">July 2026</h3><p class="tiny" style="margin-bottom:14px">'+c.attendance+'% attendance this term</p>'+
        '<div class="cal">'+cells+'</div>'+
        '<div class="cal-legend"><span><i style="background:var(--green-50);border:1px solid var(--green-600)"></i>Present</span>'+
        '<span><i style="background:var(--red-50);border:1px solid var(--red-600)"></i>Absent</span>'+
        '<span><i style="background:var(--amber-50);border:1px solid var(--amber-500)"></i>Holiday</span></div></div>'+
      '<div class="card"><h3 style="margin-bottom:14px">Instructional Hours</h3>'+
        '<div class="stat-card"><div class="num" style="color:'+acc+'">'+c.hours+'</div><div class="lbl">of '+c.hoursReq+' required (PA)</div></div>'+
        '<div class="progress" style="margin:14px 0"><span style="width:'+hoursPct+'%"></span></div>'+
        '<p class="small" style="color:var(--ink-700)">'+hoursPct+'% of the annual requirement logged. '+(c.hoursReq-c.hours)+' hours remaining this school year.</p>'+
      '</div>'+
    '</div>';
}

function renderPortfolio(c){
  var acc=ACCENT[c.id];
  var icon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4z"/><path d="M4 15l4-4 4 4 3-3 5 5"/><circle cx="9" cy="9" r="1.5"/></svg>';
  var cards=EXTRA[c.id].portfolio.map(function(p){
    return '<div class="port-card card-hover">'+
      '<div class="port-thumb" style="background:linear-gradient(135deg,'+acc+' 0%, '+shade(acc)+' 100%)">'+icon+'</div>'+
      '<div class="port-body"><div style="font-weight:600;font-size:14px">'+p[0]+'</div>'+
        '<div class="tiny" style="margin:4px 0 10px">'+p[1]+' · '+p[2]+'</div>'+
        '<a class="btn btn-ghost btn-sm" href="#" onclick="showToast(\'Opening work sample\');return false;">View</a></div>'+
    '</div>';
  }).join('');
  document.getElementById('pPortfolio').innerHTML='<div class="card"><h3 style="margin-bottom:16px">Work Samples</h3><div class="port-grid">'+cards+'</div></div>';
}

function renderRail(c){
  var acc=ACCENT[c.id];
  var notes=EXTRA[c.id].notes.map(function(n){
    return '<div class="note-item"><div style="font-weight:600;margin-bottom:2px">'+n[0]+'</div><div class="small" style="color:var(--ink-700)">'+n[1]+'</div></div>';
  }).join('');
  var faithBlock='<div class="card rail-card" style="border:1px solid var(--line);background:var(--grad-soft)">'+
    '<h4 style="display:flex;align-items:center;gap:8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="'+acc+'" stroke-width="2"><path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 16.5 7.1 18.2 8 12.7l-4-3.9 5.5-.8z"/></svg>Faith &amp; Character</h4>'+
    '<p class="small" style="color:var(--ink-700);margin-top:8px">'+c.faith+'</p>';
  if(c.id==='layla'){
    faithBlock+='<div style="margin-top:14px"><div class="tiny" style="margin-bottom:6px">Qur\'an memorization — Surah Ar-Rahman</div>'+
      '<div class="progress"><span style="width:64%"></span></div><div class="tiny" style="margin-top:6px">Ayah 1–48 of 78 memorized</div></div>';
  }
  faithBlock+='<div style="margin-top:14px;display:flex;align-items:center;gap:8px">'+
    '<span class="pill" style="background:#fff;color:'+acc+';border:1px solid '+acc+'">'+c.streak+'-day streak</span>'+
    '<span class="tiny">Keep it going, masha\'Allah</span></div></div>';
  document.getElementById('childRail').innerHTML=
    '<div class="card rail-card" style="margin-bottom:24px"><h4>Parent Notes</h4>'+notes+
      '<button class="btn btn-ghost btn-sm" style="margin-top:12px" onclick="showToast(\'Note added\')">+ Add note</button></div>'+
    faithBlock;
}

function renderChild(id){
  var c=FAMILY.children.find(x=>x.id===id);
  renderSwitcher(id);
  renderHero(c);
  renderCourses(c);
  renderGrades(c);
  renderAttendance(c);
  renderPortfolio(c);
  renderRail(c);
  // animate progress bars that were just injected
  document.querySelectorAll('.progress>span').forEach(function(el){var w=el.style.width;el.style.width='0';setTimeout(()=>el.style.width=w,60);});
}

renderChild('yusuf');
</script>
