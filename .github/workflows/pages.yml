name: Deploy to GitHub Pages + Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage site files
        run: |
          mkdir -p _site
          cp *.html *.css *.js _site/
          cp robots.txt sitemap.xml vercel.json _site/ 2>/dev/null || true
          cp -r public/* _site/ 2>/dev/null || true
          cp -r preview browse quote _site/ 2>/dev/null || true
          # Create clean-URL redirect folders for GitHub Pages
          for page in browse quote about pricing compare arabic curriculum-builder path-builder apps frameworks resources; do
            if [ -f "_site/${page}.html" ] || [ "$page" = "browse" ]; then
              mkdir -p "_site/${page}"
              if [ "$page" = "browse" ]; then
                dest="frameworks.html"
              else
                dest="${page}.html"
              fi
              echo "<!doctype html><html><head><meta charset=\"utf-8\"><meta http-equiv=\"refresh\" content=\"0;url=../${dest}\"><link rel=\"canonical\" href=\"../${dest}\"></head><body><a href=\"../${dest}\">Redirecting…</a></body></html>" > "_site/${page}/index.html"
            fi
          done
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-vercel:
    needs: build
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Vercel credentials
        id: creds
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN secret not set — skipping Vercel deploy."
          fi

      - name: Install Vercel CLI
        if: steps.creds.outputs.ok == 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        if: steps.creds.outputs.ok == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel (production)
        if: steps.creds.outputs.ok == 'true'
        run: vercel deploy --prod --token="$VERCEL_TOKEN"
